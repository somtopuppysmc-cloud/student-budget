{% extends "layout.html" %}

{% block body %}
    <main class="add-expense-page edit-expense-page">
        <a class="expense-back-link" href="{{ url_for('expenses') }}">← Back to expenses</a>
        <section class="add-expense-card">
            <p class="expenses-eyebrow">Keep your spending up to date</p>
            <h1>Edit expense</h1>
            <p class="add-expense-intro">Update the details for this expense.</p>
            <form class="add-expense-form" method="POST" action="{{ url_for('edit_expense', id=expense.id) }}">
                <div class="expense-form-field">
                    <label for="amount">Amount</label>
                    <div class="expense-amount-input">
                        <span aria-hidden="true">&#8358;</span>
                        <input type="number" id="amount" name="amount" min="1" step="1" value="{{ expense.amount }}" required>
                    </div>
                </div>
                <div class="expense-form-field">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        {% for category in categories %}
                            <option value="{{ category.id }}" {% if category.id == expense.budget_category_id %}selected{% endif %}>{{ category.category }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="expense-form-field">
                    <label for="description">Description <span>(optional)</span></label>
                    <textarea id="description" name="description">{{ expense.description or '' }}</textarea>
                </div>
                <button class="expense-button" type="submit">Update expense</button>
            </form>
        </section>
    </main>
{% endblock %}
