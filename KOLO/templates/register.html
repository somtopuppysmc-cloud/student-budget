{% extends "layout2.html" %}
{% block body %}
    <div class="register">
    <h2>Create your account</h2>
    <div class="register-form">
    <form method="POST" action="/register">
        <label for="full_name">Full name:</label>
        <input type="text" id="full_name" name="full_name" autocomplete="off" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" autocomplete="off" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" autocomplete="off" required><br><br>

        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="off" required><br><br>

        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="/login">Login here</a></p>
</div>
{% endblock %}
